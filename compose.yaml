# =====================================================================
# compose.yaml - Barbershop (Laravel 12 + MySQL 8.4)
#
# Service  : app (PHP + Apache), database (MySQL)
# Network  : frontend (akses publik), backend (internal, khusus database)
# Volume   : db_data (data MySQL), app_storage (storage/app Laravel)
#
# Semua nilai rahasia dibaca dari file .env (lihat .env.example).
# Jalankan : docker compose up -d --build
# =====================================================================

# Nama project -> awalan nama network dan volume (barbershop_db_data, dst.)
# sehingga tidak bentrok dengan project Docker lain di mesin yang sama.
name: barbershop

services:

  # -------------------------------------------------------------------
  # Aplikasi Laravel (PHP 8.4 + Apache), dibangun dari Dockerfile
  # -------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: barbershop-app:latest
    container_name: barbershop_app
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    ports:
      # Port host bisa diganti lewat APP_PORT (mis. 8080 saat XAMPP masih aktif).
      # Di Azure VM biarkan 80.
      - "0.0.0.0:${APP_PORT:-80}:80"
    environment:
      # --- Aplikasi ---
      APP_NAME: ${APP_NAME:-Barbershop}
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${APP_KEY:?APP_KEY wajib diisi di file .env}
      APP_URL: ${APP_URL:-http://localhost}
      # --- Database (host = nama service, bukan alamat publik) ---
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-barbershop}
      DB_USERNAME: ${DB_USERNAME:-barbershop}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib diisi di file .env}
      # --- Laravel ---
      SESSION_DRIVER: ${SESSION_DRIVER:-database}
      CACHE_STORE: ${CACHE_STORE:-database}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-sync}
      LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
      MAIL_MAILER: ${MAIL_MAILER:-log}
      # --- Otomatisasi saat container start (docker/entrypoint.sh) ---
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      RUN_SEEDERS: ${RUN_SEEDERS:-true}
      SEEDER_CLASS: ${SEEDER_CLASS:-AdminSeeder}
      # --- Akun admin awal (dipakai AdminSeeder) ---
      ADMIN_NAME: ${ADMIN_NAME:-Admin Barbershop}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@barbershop.test}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD wajib diisi di file .env}
    volumes:
      - app_storage:/var/www/html/storage/app
    networks:
      - frontend
      - backend
    healthcheck:
      # /up = health route bawaan Laravel (bootstrap/app.php)
      test: ["CMD", "curl", "-fsS", "http://localhost/up"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # -------------------------------------------------------------------
  # Database MySQL 8.4 (image resmi)
  # Tidak ada "ports": database tidak dapat diakses dari luar VM.
  # -------------------------------------------------------------------
  database:
    image: mysql:8.4
    container_name: barbershop_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-barbershop}
      MYSQL_USER: ${DB_USERNAME:-barbershop}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib diisi di file .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD wajib diisi di file .env}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      # $$ = tanda $ dikirim ke dalam container (bukan dibaca Compose)
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

# ---------------------------------------------------------------------
# Network
#   frontend : jaringan sisi web (port 80 dipublikasikan dari app)
#   backend  : internal: true -> hanya antar-container, tanpa akses keluar
# ---------------------------------------------------------------------
networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true

# ---------------------------------------------------------------------
# Volume (data tetap ada setelah "docker compose down";
# hanya "docker compose down -v" yang menghapusnya)
# ---------------------------------------------------------------------
volumes:
  db_data:
  app_storage:
